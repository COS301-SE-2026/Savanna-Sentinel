name: Backend CI pipeline

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'

permissions:
  contents: read
  packages: write

jobs:
  backend-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: savanna_sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/savanna_sentinel
      JWT_SECRET: ci-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install ruff
          pip install pytest
          pip install pytest-cov

      - name: Linter
        run: ruff check backend/
        # run: ruff check backend/ --exit-zero # (Caution) Uncomment this to ALWAYS RETURN POSITIVES

      - name: Apply schema
        run: psql postgresql://postgres:postgres@localhost:5432/savanna_sentinel -f backend/schema.sql

      - name: Tests (with coverage)
        run: pytest backend/tests/ --cov=backend --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend
        uses: docker/build-push-action@v5

        with:
          context: ./backend
          # Changing push: true in the workflow to send images to GitHub Container Registry or DockerHub.
          push: false  # Don't push to a registry yet, just test the build
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max