name: Backend CI pipeline

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'

permissions:
  contents: read
  packages: write

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install ruff
          pip install pytest

      - name: Linter
        run: ruff check backend/
        # run: ruff check backend/ --exit-zero # (Caution) Uncomment this to ALWAYS RETURN POSITIVES

      - name: Tests
        run: pytest backend/tests/
    

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend
        uses: docker/build-push-action@v5

        with:
          context: ./backend
          # Changing push: true in the workflow to send images to GitHub Container Registry or DockerHub.
          push: false  # Don't push to a registry yet, just test the build
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max