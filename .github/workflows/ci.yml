name: CI pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:

  # Job 1: Backend
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend
        uses: docker/build-push-action@v5

        with:
          context: ./backend
          # Changing push: true in the workflow to send images to GitHub Container Registry or DockerHub.
          push: false  # Don't push to a registry yet, just test the build
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 2: Frontend
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend
        uses: docker/build-push-action@v5

        with:
          context: ./frontend
          push: false
          load: true
          # leaving as commented for now until we use any API's in frontend, but this is a template
          # API_URL = ARG API_URL in dockerfile
          # secrets.API_URL = ENV VITE_API_URL=$API_URL in dockerfile 
          # So 'build:pwa' command has context
          # build-args: |
          #   API_URL=${{ secrets.API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
