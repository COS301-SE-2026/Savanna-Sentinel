name: Deploy to production

on:
  workflow_run:
    workflows:
     - "Frontend CI Pipeline"
     - "Backend CI Pipeline"
     - "E2E Tests CI pipeline"
    branches:
      - main
    types:
      - completed

  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or tag to deploy (blank = latest main). Used for rollback."
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch'}} || (github.event_workflow_run.conclusion == 'success') }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Savanna-Sentinel
            git fetch origin
            git checkout ${{ github.event.inputs.ref || github.sha }}
            docker compose -f docker-compose.yml --profile prod up -d --build
            docker image prune -f
