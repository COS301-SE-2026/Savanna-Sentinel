name: Deploy to production

on:
  workflow_run:
    workflows:
      - "Frontend CI Pipeline"
      - "Backend CI Pipeline"
      - "E2E Tests CI pipeline"
    branches:
      - main
    types:
      - completed

  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA or tag to deploy (blank = latest main). Used for rollback."
        required: false

permissions:
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ github.event.inputs.ref || github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_SSM_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy via AWS SSM
        id: deploy
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy commit $IMAGE_TAG" \
            --parameters "commands=[\"bash ${{ vars.EC2_APP_DIR }}/infra/deploy.sh '$IMAGE_TAG' '${{ vars.AWS_REGION }}'\"]" \
            --query "Command.CommandId" \
            --output text)"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

      - name: Show deploy output
        if: always()
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text || true
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text || true
