# Applied automatically during local development (docker compose up).
# Enables hot-reload for backend and vite dev server for frontend.

services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
      # Replaces the park_data volume so dev reads the grid from the working tree.
      - ./backend/app/data:/app/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      MINIO_PUBLIC_ENDPOINT: localhost:9000

  worker:
    volumes:
      - ./backend:/app
      - ./backend/app/data:/app/app/data

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/v1
    # Vite requires more memory
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
