# Applied automatically during local development (docker compose up).
# Enables hot-reload for backend and vite dev server for frontend.

services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000/v1
    # Vite requires more memory
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
